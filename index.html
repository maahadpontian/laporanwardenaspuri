// Upload gambar ke Supabase Storage, return public URL
async function uploadGambar(base64, filename) {
  if (!base64) return null;
  for (let attempt = 0; attempt < 3; attempt++) { // cuba 3 kali
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000); // 30 saat
      // Convert base64 to blob tanpa guna fetch (lebih stabil kat mobile)
      const byteStr = atob(base64.split(",")[1]);
      const mimeStr = base64.split(",")[0].split(":")[1].split(";")[0];
      const arr = new Uint8Array(byteStr.length);
      for (let b=0; b<byteStr.length; b++) arr[b] = byteStr.charCodeAt(b);
      const blob = new Blob([arr], {type: mimeStr});
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/laporangambaraspuri/${filename}`, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "image/jpeg" },
        body: blob,
        signal: controller.signal
      });
      clearTimeout(timeout);
      if (res.ok) return `${SUPABASE_URL}/storage/v1/object/public/laporangambaraspuri/${filename}`;
    } catch(e) {
      if (attempt < 2) await new Promise(r => setTimeout(r, 2000)); // tunggu 2s sebelum retry
    }
  }
  return null; // gagal lepas 3 cuba
}

// Upload semua gambar dalam object (nested), return object dengan URL
async function uploadAllGambar(obj, prefix) {
  if (Array.isArray(obj)) {
    return await Promise.all(obj.map((v,i) => uploadAllGambar(v, `${prefix}_${i}`)));
  }
  if (obj && typeof obj === "object") {
    const r = {};
    for (const k in obj) {
      if (k === "gambar" && Array.isArray(obj[k])) {
        r[k] = [];
        for (let i=0; i<(obj[k]||[]).length; i++) {
          const src = obj[k][i];
          if (!src || src.startsWith("http")) { r[k].push(src); continue; }
          const fname = `${prefix}_${k}_${i}_${Date.now()}.jpg`;
          r[k].push(await uploadGambar(src, fname)); // sequential - satu lepas satu
        }
      } else {
        r[k] = await uploadAllGambar(obj[k], `${prefix}_${k}`);
      }
    }
    return r;
  }
  return obj;
}

// Auto delete gambar lebih 30 hari dari Supabase Storage
async function autoCleanupGambar() {
  try {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/laporangambaraspuri`, {
      method: "POST",
      headers: { ...hdrs },
      body: JSON.stringify({ prefix: "", limit: 1000, offset: 0 })
    });
    if (!res.ok) return;
    const files = await res.json();
    const cutoff = Date.now() - (30 * 24 * 60 * 60 * 1000); // 30 hari
    const toDelete = (files||[]).filter(f => {
      // Extract timestamp from filename e.g. ..._1234567890123.jpg
      const match = f.name.match(/_(\d{13})\.jpg$/);
      if (!match) return false;
      return parseInt(match[1]) < cutoff;
    }).map(f => f.name);

    if (toDelete.length === 0) return;
    await fetch(`${SUPABASE_URL}/storage/v1/object/laporangambaraspuri`, {
      method: "DELETE",
      headers: { ...hdrs },
      body: JSON.stringify({ prefixes: toDelete })
    });
    console.log(`Auto-deleted ${toDelete.length} gambar lama`);
  } catch(e) { console.log("Cleanup error:", e); }
}

// ── GambarSlots component ─────────────────────────────────────
function GambarSlots({ imgs, onChange }) {
  const slots = imgs || [null, null];
  function pick(slot) {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const rd = new FileReader();
      rd.onload = function(ev) {
        // Compress gambar sebelum simpan
        const img = new Image();
        img.onload = function() {
          const MAX = 600; // max 600px
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) {
            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
            else { w = Math.round(w * MAX / h); h = MAX; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL("image/jpeg", 0.55); // 55% quality
          const newImgs = [...slots];
          newImgs[slot] = compressed;
          onChange(newImgs);
        };
        img.src = ev.target.result;
      };
      rd.readAsDataURL(file);
    };
    inp.click();
  }
  function remove(slot) {
    const newImgs = [...slots];
    newImgs[slot] = null;
    onChange(newImgs);
  }
  return (
    <div className="gambar-row">
      {[0,1].map(slot => (
        <div key={slot} className="img-wrap">
          <div className={`img-slot${slots[slot]?" filled":""}`} onClick={() => pick(slot)}>
            {slots[slot]
              ? <img src={slots[slot]} alt=""/>
              : <span style={{fontSize:20,color:"#cbd5e1"}}>📷</span>
            }
          </div>
          {slots[slot] && <button className="img-del" onClick={e=>{e.stopPropagation();remove(slot);}}>x</button>}
        </div>
      ))}
    </div>
  );
}

      {val>0 && <span style={{fontSize:11,color:SKALA_COLOR[val],fontWeight:700,alignSelf:"center",marginLeft:4}}>{SKALA_LABEL[val]}</span>}

  );
}

// ── Export PDF ────────────────────────────────────────────────
function imgToBase64(url) { return url||null; }

function exportPDF(lap) {
  try {
  const c = lap.warden_color || wColor(lap.nama_warden);
  const disiplin = lap.disiplin || {};
  const aspek = lap.aspek || {};
  const catAspek = lap.catatan_aspek || {};
  const kesihatan = lap.kesihatan || [];

  function imgHtml(arr) {
    return (arr||[]).filter(Boolean).map(src=>`<img src="${src}" crossorigin="anonymous" style="width:55px;height:55px;object-fit:cover;border-radius:4px;margin:2px;border:1px solid #eadcf5" onerror="this.style.display='none'"/>`).join("");
  }

  // Pre-convert all gambar to cache DULU sebelum bina rows
  const aspekB64Cache = {};
  const allAspekImgs = [];
  Object.values(disiplin).forEach(d=>{ (d.gambar||[]).filter(Boolean).forEach(src=>{ allAspekImgs.push(src); }); });
  ASPEK_TEMPLATE.forEach(kat=>{
    kat.items.forEach(item=>{
      const key=`${kat.bil}_${item}`, d=aspek[key]||{};
      (d.gambar||[]).filter(Boolean).forEach(src=>{ if(!aspekB64Cache[src]) allAspekImgs.push(src); });
    });
  });
  ASPEK_CATATAN.forEach(a=>{ const d=catAspek[a.bil]||{}; (d.gambar||[]).filter(Boolean).forEach(src=>{ if(!aspekB64Cache[src]) allAspekImgs.push(src); }); });
  [...new Set(allAspekImgs)].forEach(src=>{ aspekB64Cache[src]=imgToBase64(src); });
  function imgHtmlB64(arr){ return (arr||[]).filter(Boolean).map(src=>`<img src="${aspekB64Cache[src]||src}" style="width:55px;height:55px;object-fit:cover;border-radius:4px;margin:2px;border:1px solid #eadcf5"/>`).join(""); }

  let disiplinRows = DISIPLIN_ITEMS.map((item,i)=>{
    const d=disiplin[item]||{};
    return `<tr>
      <td style="padding:6px 8px;border:1px solid #eadcf5">${"abcde"[i]}.</td>
      <td style="padding:6px 8px;border:1px solid #eadcf5">${item}</td>
      <td style="text-align:center;border:1px solid #eadcf5">${d.penilaian==="Ikut jadual"?"●":""}</td>
      <td style="text-align:center;border:1px solid #eadcf5">${d.penilaian==="Tidak ikut jadual"?"●":""}</td>
      <td style="padding:6px 8px;border:1px solid #eadcf5;font-size:11px">${d.catatan||""}${imgHtmlB64(d.gambar)?"<br/>"+imgHtmlB64(d.gambar):""}</td>
    </tr>`;
  }).join("");

  let aspekRows = "";
  ASPEK_TEMPLATE.forEach(kat=>{
    if (kat.items.length>0) {
      aspekRows += `<tr><td style="font-weight:700;padding:8px;border:1px solid #eadcf5;background:#f8fafc" colspan="8">${kat.bil}. ${kat.kategori}</td></tr>`;
      kat.items.forEach(item=>{
        const key=`${kat.bil}_${item}`, d=aspek[key]||{};
        if (kat.kerohanian) {
          const statusColor = d.status==="Ada"?"#16a34a":d.status==="Tiada"?"#dc2626":"#94a3b8";
          aspekRows += `<tr>
            <td style="padding:6px 8px;border:1px solid #eadcf5;padding-left:20px" colspan="2">${item}</td>
            <td style="padding:6px 8px;border:1px solid #eadcf5;text-align:center;font-weight:700;color:${statusColor}" colspan="5">${d.status||"—"}</td>
            <td style="padding:6px 8px;border:1px solid #eadcf5;font-size:11px">${d.catatan||""}</td>
          </tr>`;
        } else {
          if (kat.noSkala) {
            aspekRows += `<tr>
              <td style="padding:6px 8px;border:1px solid #eadcf5;padding-left:20px" colspan="2">${item}</td>
              <td style="text-align:center;border:1px solid #eadcf5;font-size:16px;font-weight:700" colspan="5">${d.tick?"✓":""}</td>
              <td style="padding:6px 8px;border:1px solid #eadcf5;font-size:11px">${d.catatan||""}</td>
            </tr>`;
          } else {
            aspekRows += `<tr>
              <td style="padding:6px 8px;border:1px solid #eadcf5;padding-left:20px" colspan="2">${item}</td>
              ${[1,2,3,4,5].map(s=>`<td style="text-align:center;border:1px solid #eadcf5;background:${d.skala==s?SKALA_BG[s]:"#fff"}">${d.skala==s?"●":""}</td>`).join("")}
              <td style="padding:6px 8px;border:1px solid #eadcf5;font-size:11px">${d.catatan||""}${imgHtmlB64(d.gambar)?"<br/>"+imgHtmlB64(d.gambar):""}</td>
              <td style="padding:6px 8px;border:1px solid #eadcf5;font-size:11px">${d.tindakan||""}</td>
            </tr>`;
          }
        }
      });
    } else {
      const key=`${kat.bil}`, d=aspek[key]||{};
      aspekRows += `<tr>
        <td style="font-weight:700;padding:8px;border:1px solid #eadcf5" colspan="2">${kat.bil}. ${kat.kategori}</td>
        ${[1,2,3,4,5].map(s=>`<td style="text-align:center;border:1px solid #eadcf5;background:${d.skala==s?SKALA_BG[s]:"#fff"}">${d.skala==s?"●":""}</td>`).join("")}
        <td style="padding:6px 8px;border:1px solid #eadcf5;font-size:11px">${d.catatan||""}${imgHtmlB64(d.gambar)?"<br/>"+imgHtmlB64(d.gambar):""}</td>
        <td style="padding:6px 8px;border:1px solid #eadcf5;font-size:11px">${d.tindakan||""}</td>
      </tr>`;
    }
  });

  let catatanRows = ASPEK_CATATAN.map(a=>{
    const d=catAspek[a.bil]||{};
    return `<tr>
      <td style="padding:8px;border:1px solid #eadcf5;font-weight:700">${a.bil}</td>
      <td style="padding:8px;border:1px solid #eadcf5;font-weight:700">${a.label}</td>
      <td style="padding:8px;border:1px solid #eadcf5">${d.catatan||""}${imgHtmlB64(d.gambar)?"<br/>"+imgHtmlB64(d.gambar):""}</td>
      <td style="padding:8px;border:1px solid #eadcf5">${d.tindakan||""}</td>
    </tr>`;
  }).join("");

  // Convert all kesihatan gambar to base64
  const kesihatanWithB64 = kesihatan.map(k => ({
    ...k,
    gambarB64: (k.gambar||[]).filter(Boolean).map(src=>imgToBase64(src))
  }));

    `<tr>

    </tr>`
  ).join("");

  const lainGambarHtml = ((lap.lain_lain_gambar||[]).filter(Boolean).map(src=>imgToBase64(src))).map(src=>`<img src="${src}" style="width:100px;height:100px;object-fit:cover;border-radius:6px;margin:4px;border:1px solid #eadcf5"/>`).join("");

      if (!bulkWeek) return [];
      const [yr,wk] = bulkWeek.split("-W").map(Number);
      const jan4 = new Date(yr,0,4);
      const weekStart = new Date(jan4);
      weekStart.setDate(jan4.getDate() - (jan4.getDay()||7) + 1 + (wk-1)*7);
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
      return filteredLaporan.filter(l=>{ const d=new Date(l.tarikh+"T00:00:00"); return d>=weekStart&&d<=weekEnd; });
    }
    if (bulkType==="bulan") {
      if (!bulkMonth) return [];
      return filteredLaporan.filter(l=>l.tarikh.startsWith(bulkMonth));

      if (!bulkFrom||!bulkTo) return [];

  async function saveDraft() {
    if (!form.nama_warden) return showToast("⚠️ Pilih nama warden dulu!","err");
    // Buang gambar base64 (terlalu besar → draft gagal simpan / hilang)
    const stripImg = (o) => Array.isArray(o) ? o.map(stripImg)
      : (o && typeof o === "object")
        ? Object.fromEntries(Object.entries(o).map(([k,v]) => [k, k==="gambar" ? (v||[]).map(()=>null) : stripImg(v)]))
        : o;
    const draft = stripImg(form);
    const {error} = await db.saveDraft(form.nama_warden, draft);
    if (error) {
      // fallback ke localStorage (jangan biar throw kalau penuh)
      try {
        localStorage.setItem(`draft_laporan_perempuan_${form.nama_warden}`, JSON.stringify(draft));
      } catch(e) {
        return showToast("⚠️ Draft gagal disimpan", "err");
      }
    }
    setHasDraft(true);
    showToast("💾 Draft disimpan! (gambar tak termasuk dalam draft)");
  }

  async function loadDraft() {
    if (!form.nama_warden) return showToast("⚠️ Pilih nama warden dulu!","err");
    const {data} = await db.loadDraft(form.nama_warden);
    if (data) {
      setForm(data);
      showToast("📂 Draft dimuatkan!");
    } else {
      // Cuba localStorage
      const saved = localStorage.getItem(`draft_laporan_perempuan_${form.nama_warden}`);
      if (saved) { setForm(JSON.parse(saved)); showToast("📂 Draft dimuatkan!"); }
      else showToast("⚠️ Tiada draft untuk warden ini","err");
    }
  }

  async function clearDraft() {
    if (!form.nama_warden) return;
    await db.deleteDraft(form.nama_warden);
    localStorage.removeItem(`draft_laporan_perempuan_${form.nama_warden}`);
    setHasDraft(false);
  }

  async function submitForm() {
    if (!form.nama_warden) return showToast("⚠️ Pilih nama warden!","err");
    const warden = wardenList.find(w=>w.nama===form.nama_warden);

    // Strip gambar dari payload Supabase (terlalu besar)
    function stripGambar(obj) {
      if (Array.isArray(obj)) return obj.map(stripGambar);
      if (obj && typeof obj === "object") {
        const r = {};
        for (const k in obj) {
          if (k === "gambar") r[k] = (obj[k]||[]).map(()=>null); // kosongkan gambar
          else r[k] = stripGambar(obj[k]);
        }
        return r;
      }
      return obj;
    }

    setLoading(true);
    showToast("⏳ Menghantar laporan...", "warn");
    try {
      const formToSave = {...form, warden_color: warden?.color};
      const {error} = await db.insertLaporan(formToSave);
      if (error) {
        console.error("Supabase error:", error);
        local.save(formWithUrls);
        showToast("⚠️ Error: " + JSON.stringify(error).slice(0,100), "err");
      } else {
        showToast("✅ Laporan berjaya dihantar!");
        clearDraft();
      }
    } catch(err) {
      console.error("Submit error:", err);
      local.save({...form});
      showToast("💾 Tersimpan offline (ada ralat)", "warn");
    }
    setForm(initForm());
    setLoading(false);
    loadLaporan();
  }

  function requestDeleteLap(id) {
    if (adminUnlocked) {
      if (!window.confirm("Padam laporan ini?")) return;
      doDeleteLap(id);
    } else {
      setPendingDeleteId(id);
      setShowAdminPin(true);
      setAdminPinInput("");
      setAdminPinError(false);
    }
  }
  async function doDeleteLap(id) {
    if (String(id).startsWith("local_")) local.remove(id); else await db.deleteLaporan(id);
    loadLaporan(); showToast("🗑️ Laporan dipadam");
  }
  function checkAdminPin() {
    if (adminPinInput===JADUAL_PIN) {
      setAdminUnlocked(true);
      setShowAdminPin(false);
      setAdminPinError(false);
      if (pendingDeleteId) { doDeleteLap(pendingDeleteId); setPendingDeleteId(null); }
    } else {
      setAdminPinError(true);
      setTimeout(()=>setAdminPinError(false),1500);
    }
  }

  function checkPin() {
    if (pinInput===JADUAL_PIN) { setPinUnlocked(true); setPinError(false); }
    else { setPinError(true); setTimeout(()=>setPinError(false),1500); }
  }

  async function addJadual() {
    if (!newTarikh||!newWarden) return;
    const row = {tarikh:newTarikh,nama_warden:newWarden};
    const {error} = await db.upsertJadual(row);
    if (error) { localJ.upsert(row); showToast("💾 Jadual disimpan offline","warn"); } else showToast("✅ Jadual disimpan!");
    loadJadual();
  }

  async function deleteJadual(id) {
    if (!window.confirm("Padam entri jadual ini?")) return;
    if (String(id).startsWith("jadual_")) localJ.remove(id); else await db.deleteJadual(id);
    loadJadual(); showToast("🗑️ Jadual dipadam");
  }

  async function scanJadual(file) {
    setScanning(true); setScanResult(null); setScanError("");
    try {
      const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });
      const names = wardenList.map(w=>w.nama).join(", ");
      const isPDF = file.type==="application/pdf";
      const contentBlock = isPDF
        ? {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}}
        : {type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:base64}};

        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:[
          contentBlock,
          {type:"text",text:`Ini jadual giliran warden. Nama warden yang ada: ${names}. Padankan nama dalam jadual dengan nama yang diberikan. Balas JSON array sahaja tanpa sebarang teks lain: [{"tarikh":"YYYY-MM-DD","nama_warden":"nama penuh"}]`}
        ]}]
      })});
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message);
      const text = (data.content||[]).map(c=>c.text||"").join("").trim().replace(/```json|```/g,"").trim();
      setScanResult(JSON.parse(text));
    } catch(e) { setScanError("Gagal baca jadual: "+e.message); }
    setScanning(false);
  }

  async function confirmScan() {
    if (!scanResult) return;
    const {error} = await db.upsertJadual(scanResult);
    if (error) { localJ.upsert(scanResult); showToast("💾 Disimpan offline","warn"); } else showToast(`✅ ${scanResult.length} entri disimpan!`);

  }

              <h1 style={{color:"#4c1d59",fontSize:42,fontWeight:900,margin:"0 0 4px",lineHeight:1.1}}>Selamat<br/>Datang</h1>
              <p style={{color:"#7e6a8a",fontSize:14,margin:"12px 0 0"}}>Pilih peranan anda untuk masuk.</p>
            </div>
            {/* Role buttons */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
              {[["Warden","🧑‍💼"],["Pentadbir","👩‍💼"]].map(([role,icon])=>(
                <button key={role} onClick={()=>{setLoginRole(role);setLoginName("");}} style={{
                  padding:"22px 12px",borderRadius:14,cursor:"pointer",fontWeight:700,fontSize:15,
                  border:`1px solid ${loginRole===role?"rgba(168,85,247,.50)":"rgba(192,132,252,.20)"}`,
                  background:loginRole===role?"linear-gradient(135deg,#f3e8ff,#fce7f3)":"rgba(255,255,255,.66)",
                  color:loginRole===role?"#7e22ce":"#6b5477",
                  transition:"all .2s",display:"flex",flexDirection:"column",alignItems:"center",gap:8,
                  boxShadow:loginRole===role?"0 12px 30px rgba(168,85,247,.18)":"0 8px 24px rgba(109,40,217,.06)",
                }}>
                  <span style={{fontSize:28}}>{icon}</span>{role}
                </button>
              ))}
              <div style={{gridColumn:"1 / -1",display:"flex",justifyContent:"center"}}>
                <button onClick={()=>{setLoginRole("S/U & Penyelia");setLoginName("");}} style={{
                  padding:"22px 12px",borderRadius:14,cursor:"pointer",fontWeight:700,fontSize:15,
                  border:`1px solid ${loginRole==="S/U & Penyelia"?"rgba(168,85,247,.50)":"rgba(192,132,252,.20)"}`,
                  background:loginRole==="S/U & Penyelia"?"linear-gradient(135deg,#f3e8ff,#fce7f3)":"rgba(255,255,255,.66)",
                  color:loginRole==="S/U & Penyelia"?"#7e22ce":"#6b5477",
                  transition:"all .2s",display:"flex",flexDirection:"column",alignItems:"center",gap:8,width:"48%",
                  boxShadow:loginRole==="S/U & Penyelia"?"0 12px 30px rgba(168,85,247,.18)":"0 8px 24px rgba(109,40,217,.06)",
                }}>
                  <span style={{fontSize:28}}>📋</span>S/U & Penyelia
                </button>
              </div>
            </div>
            {/* Name list - Warden dengan highlight bertugas */}
            {loginRole==="Warden"&&(()=>{
              const todayDuty=jadualLoaded?(dutyWarden||MAC_2026.find(j=>j.tarikh===todayStr())?.nama_warden||null):null;
              return (
                <div style={{marginBottom:14}}>
                  {!jadualLoaded?<div style={{fontSize:11,color:"#7e6a8a",marginBottom:10,textAlign:"center"}}>⏳ Memuatkan jadual...</div>:todayDuty?<div style={{fontSize:11,color:"#7e22ce",fontWeight:700,marginBottom:10,textAlign:"center",letterSpacing:1}}>⭐ WARDEN BERTUGAS HARI INI: {todayDuty}</div>:null}
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {wardenList.map(w=>{
                      const isDuty=w.nama===todayDuty, isSel=loginName===w.nama;
                      return (
                        <button key={w.nama} onClick={()=>setLoginName(w.nama)} style={{
                          padding:"13px 16px",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:13,
                          border:`1px solid ${isSel?w.color:isDuty?w.color+"88":"rgba(192,132,252,.22)"}`,
                          background:isSel?w.color+"33":isDuty?"#f6eefe":"rgba(255,255,255,.72)",
                          color:isSel?w.color:isDuty?w.color:"#6b5477",
                          textAlign:"left",transition:"all .15s",display:"flex",alignItems:"center",gap:10,
                          position:"relative",
                        }}>
                          <div style={{width:10,height:10,borderRadius:"50%",background:w.color,flexShrink:0}}/>
                          {w.nama}
                          {isDuty&&<span style={{marginLeft:"auto",fontSize:10,background:w.color,color:"#000",padding:"2px 8px",borderRadius:20,fontWeight:800}}>BERTUGAS</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })()}
            {/* Name card list + PIN - Pentadbir */}
            {loginRole==="Pentadbir"&&(
              <div style={{marginBottom:14}}>
                <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
                  {gpkList.map(g=>{
                    const nama=g.nama||g, jawatan=g.jawatan||GPK_JAWATAN[nama]||"";
                    const isSel=loginName===nama;
                    return (
                      <button key={nama} onClick={()=>{setLoginName(nama);setLoginPin("");setLoginPinErr(false);}} style={{
                        padding:"13px 16px",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:13,
                        border:`1px solid ${isSel?"rgba(168,85,247,.50)":"rgba(192,132,252,.20)"}`,
                        background:isSel?"linear-gradient(135deg,#f3e8ff,#fce7f3)":"rgba(255,255,255,.66)",
                        color:isSel?"#7e22ce":"#6b5477",
                        textAlign:"left",transition:"all .15s",
                      }}>
                        <div style={{fontWeight:700}}>{nama}</div>
                        <div style={{fontSize:11,color:"#8b6b96",marginTop:2}}>{jawatan}</div>
                      </button>
                    );
                  })}
                </div>
                {loginName&&(
                  <div>
                    <input type="password" maxLength={4} value={loginPin} onChange={e=>{setLoginPin(e.target.value);setLoginPinErr(false);}} placeholder="Masukkan PIN (● ● ● ●)" style={{
                      width:"100%",padding:"16px 18px",borderRadius:14,
                      border:`2px solid ${loginPinErr?"#dc2626":"rgba(192,132,252,.26)"}`,
                      background:"rgba(255,255,255,.72)",color:"#4c1d59",fontSize:20,textAlign:"center",letterSpacing:8,

                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontSize:13}}>
                      <span style={{fontWeight:600,color:w.color}}>{w.nama}</span>
                      <span style={{color:"#7b6a83",fontWeight:700}}>{count}</span>
                    </div>
                    <div style={{background:"#f1f5f9",borderRadius:99,height:9,overflow:"hidden"}}>
                      <div style={{width:`${(count/maxCount)*100}%`,background:w.color,height:"100%",borderRadius:99,transition:"width .6s"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ══ JADUAL ══════════════════════════════════════════════ */}
        {tab==="jadual"&&(
          <div>
            {(isSU || isGPK) ? (
              <div>
                <div style={{...S.card,marginBottom:14,padding:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                  <label style={{...S.label,margin:0,fontSize:13,whiteSpace:"nowrap"}}>Tapis Bulan:</label>
                  <input type="month" value={fBulan} onChange={e=>setFBulan(e.target.value)} style={{...S.input,flex:1}}/>
                  <button onClick={()=>setFBulan("")} style={S.btn("#f1f5f9","#8b5b9a")}>Reset</button>
                  <span style={{fontSize:12,color:"#94a3b8",whiteSpace:"nowrap"}}>{filteredJadual.length} entri</span>
                  <button onClick={exportJadualPDF} style={{...S.btn("#241032","#fff"),padding:"6px 14px",fontSize:12,whiteSpace:"nowrap"}}>📄 Export PDF</button>
                </div>
                {renderJadualGroups(false)}
              </div>
            ) : !pinUnlocked?(
              <div style={{...S.card,maxWidth:360,margin:"60px auto",textAlign:"center",padding:36}}>
                <div style={{fontSize:40,marginBottom:12}}>🔐</div>
                <h3 style={{margin:"0 0 6px",fontSize:16}}>Admin Jadual Bertugas</h3>
                <p style={{color:"#94a3b8",fontSize:13,marginBottom:24}}>Masukkan PIN untuk edit jadual</p>
                <input type="password" maxLength={4} placeholder="● ● ● ●" value={pinInput} onChange={e=>setPinInput(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&checkPin()}
                  style={{...S.input,textAlign:"center",fontSize:24,letterSpacing:8,marginBottom:12,border:`2px solid ${pinError?"#dc2626":"#eadcf5"}`}}/>
                {pinError&&<div style={{color:"#dc2626",fontSize:12,marginBottom:10,fontWeight:600}}>PIN salah.</div>}
                <button onClick={checkPin} style={{...S.btn("#241032","#fff"),width:"100%",padding:12}}>Masuk</button>
              </div>
            ):(
              <div>
                <div style={{...S.card,marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
                    <h3 style={{margin:0,fontSize:15}}>Tambah / Kemaskini Jadual</h3>
                    <button onClick={()=>{setPinUnlocked(false);setPinInput("");}} style={{...S.btn("#f1f5f9","#7b6a83"),padding:"6px 12px",fontSize:12}}>🔒 Kunci</button>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 2fr auto",gap:10,alignItems:"end",marginBottom:18}}>
                    <div>
                      <label style={S.label}>Tarikh</label>
                      <input type="date" value={newTarikh} onChange={e=>setNewTarikh(e.target.value)} style={S.input}/>
                    </div>
                    <div>
                      <label style={S.label}>Nama Warden</label>
                      <select value={newWarden} onChange={e=>setNewWarden(e.target.value)} style={S.input}>
                        {wardenList.map(w=><option key={w.nama}>{w.nama}</option>)}
                      </select>
                    </div>
                    <button onClick={addJadual} style={{...S.btn("#241032","#fff"),padding:"10px 18px"}}>+ Simpan</button>
                  </div>
                  {/* Tetapan Warden */}
                  <div style={{paddingTop:12,marginBottom:12,borderTop:"1px solid #f1f5f9"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#374151"}}>👮 Senarai Warden</div>
                      <button onClick={()=>setShowWardenEdit(v=>!v)}
                        style={{fontSize:12,padding:"4px 12px",border:"1px solid #eadcf5",borderRadius:8,cursor:"pointer",background:"#f8fafc"}}>
                        {showWardenEdit?"Tutup":"Edit"}
                      </button>
                    </div>
                    {showWardenEdit&&(
                      <div>
                        {wardenList.map((w,i)=>(
                          <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #f1f5f9"}}>
                            <div style={{width:14,height:14,borderRadius:"50%",background:w.color,flexShrink:0}}/>
                            <div style={{flex:1,fontSize:12,color:"#374151"}}>{w.nama}</div>
                            <button onClick={()=>{
                              if(!window.confirm(`Buang ${w.nama}?`)) return;
                              const updated = wardenList.filter((_,j)=>j!==i);
                              localStorage.setItem("warden_list_perempuan", JSON.stringify(updated));
                              setWardenList(updated);
                              showToast("✅ Warden dibuang");
                            }} style={{background:"#fee2e2",color:"#dc2626",border:"none",borderRadius:6,padding:"2px 8px",cursor:"pointer",fontSize:11}}>Buang</button>
                          </div>
                        ))}
                        <div style={{marginTop:10,padding:10,background:"#f8fafc",borderRadius:8,border:"1px solid #eadcf5"}}>
                          <div style={{fontSize:12,fontWeight:600,color:"#374151",marginBottom:6}}>+ Tambah Warden Baru</div>
                          <input value={newWardenDraft.nama} onChange={e=>setNewWardenDraft(p=>({...p,nama:e.target.value.toUpperCase()}))}
                            placeholder="NAMA PENUH WARDEN" style={{width:"100%",padding:"6px 10px",border:"1px solid #eadcf5",borderRadius:6,fontSize:12,marginBottom:6,boxSizing:"border-box"}}/>
                          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
                            {["#ea580c","#7c3aed","#eab308","#db2777","#2563eb","#16a34a","#0891b2","#dc2626","#059669","#9333ea","#d97706","#0284c7"].map(c=>(
                              <button key={c} onClick={()=>setNewWardenDraft(p=>({...p,color:c}))}
                                style={{width:24,height:24,borderRadius:"50%",background:c,border:newWardenDraft.color===c?"3px solid #241032":"2px solid transparent",cursor:"pointer"}}/>
                            ))}
                          </div>
                          <button onClick={()=>{
                            if(!newWardenDraft.nama.trim()) return showToast("⚠️ Masukkan nama","err");
                            const bgMap = {"#ea580c":"#fff7ed","#7c3aed":"#f5f3ff","#eab308":"#fefce8","#db2777":"#fdf2f8","#2563eb":"#eff6ff","#16a34a":"#f0fdf4","#0891b2":"#ecfeff","#dc2626":"#fef2f2","#059669":"#ecfdf5","#9333ea":"#faf5ff","#d97706":"#fffbeb","#0284c7":"#f0f9ff"};
                            const updated = [...wardenList, {nama:newWardenDraft.nama.trim(), color:newWardenDraft.color, bg:bgMap[newWardenDraft.color]||"#f8fafc"}];
                            localStorage.setItem("warden_list_perempuan", JSON.stringify(updated));
                            setWardenList(updated);
                            setNewWardenDraft({nama:"",color:"#7b6a83"});
                            showToast("✅ Warden ditambah");
                          }} style={{...S.btn("#241032","#fff"),width:"100%",padding:8,fontSize:12}}>+ Tambah</button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Tetapan GPK */}
                  <div style={{paddingTop:12,marginBottom:12,borderTop:"1px solid #f1f5f9"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#374151"}}>🎓 Senarai Pentadbir</div>
                      <button onClick={()=>setShowGpkEdit(v=>!v)}
                        style={{fontSize:12,padding:"4px 12px",border:"1px solid #eadcf5",borderRadius:8,cursor:"pointer",background:"#f8fafc"}}>
                        {showGpkEdit?"Tutup":"Edit"}
                      </button>
                    </div>
                    {showGpkEdit&&(
                      <div>
                        {gpkList.map((g,i)=>(
                          <div key={i} style={{padding:"6px 0",borderBottom:"1px solid #f1f5f9"}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                              <div>
                                <div style={{fontSize:12,fontWeight:600,color:"#374151"}}>{g.nama||g}</div>
                                <div style={{fontSize:11,color:"#94a3b8"}}>{g.jawatan||""}</div>
                              </div>
                              <button onClick={()=>{
                                if(!window.confirm(`Buang ${g.nama||g}?`)) return;
                                const updated = gpkList.filter((_,j)=>j!==i);
                                localStorage.setItem("gpk_list_perempuan_v2", JSON.stringify(updated));
                                setGpkList(updated);
                                showToast("✅ GPK dibuang");
                              }} style={{background:"#fee2e2",color:"#dc2626",border:"none",borderRadius:6,padding:"2px 8px",cursor:"pointer",fontSize:11}}>Buang</button>
                            </div>
                          </div>
                        ))}
                        <div style={{marginTop:10,padding:10,background:"#f8fafc",borderRadius:8,border:"1px solid #eadcf5"}}>
                          <div style={{fontSize:12,fontWeight:600,color:"#374151",marginBottom:6}}>+ Tambah GPK Baru</div>
                          <input value={newGpkDraft.nama} onChange={e=>setNewGpkDraft(p=>({...p,nama:e.target.value.toUpperCase()}))}
                            placeholder="NAMA PENUH" style={{width:"100%",padding:"6px 10px",border:"1px solid #eadcf5",borderRadius:6,fontSize:12,marginBottom:6,boxSizing:"border-box"}}/>
                          <input value={newGpkDraft.jawatan} onChange={e=>setNewGpkDraft(p=>({...p,jawatan:e.target.value}))}
                            placeholder="Jawatan (contoh: GPK HEM)" style={{width:"100%",padding:"6px 10px",border:"1px solid #eadcf5",borderRadius:6,fontSize:12,marginBottom:8,boxSizing:"border-box"}}/>
                          <button onClick={()=>{
                            if(!newGpkDraft.nama.trim()) return showToast("⚠️ Masukkan nama","err");
                            const updated = [...gpkList, {nama:newGpkDraft.nama.trim(), jawatan:newGpkDraft.jawatan.trim()}];
                            localStorage.setItem("gpk_list_perempuan_v2", JSON.stringify(updated));
                            setGpkList(updated);
                            setNewGpkDraft({nama:"",jawatan:""});
                            showToast("✅ GPK ditambah");
                          }} style={{...S.btn("#241032","#fff"),width:"100%",padding:8,fontSize:12}}>+ Tambah</button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Tetapan Enrolmen */}
                  <div style={{paddingTop:12,marginBottom:12,borderTop:"1px solid #f1f5f9"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#374151"}}>🏠 Tetapan Kapasiti Dorm</div>
                      <button onClick={()=>{ setKapasitiDraft(Object.fromEntries(DORMS.map(d=>[d.nama, getDormBil(d.nama)]))); setShowKapasitiEdit(v=>!v); }}
                        style={{fontSize:12,padding:"4px 12px",border:"1px solid #eadcf5",borderRadius:8,cursor:"pointer",background:"#f8fafc"}}>
                        {showKapasitiEdit?"Tutup":"Edit"}
                      </button>
                    </div>
                    {showKapasitiEdit&&(
                      <div>
                        <div style={{maxHeight:300,overflowY:"auto",border:"1px solid #eadcf5",borderRadius:10,marginBottom:10}}>
                          {DORMS.map((d,i)=>(
                            <div key={d.nama} style={{display:"grid",gridTemplateColumns:"1fr 80px",alignItems:"center",padding:"8px 12px",borderBottom:i<DORMS.length-1?"1px solid #f1f5f9":"none"}}>
                              <div style={{fontSize:12,color:"#374151"}}>{d.nama}</div>
                              <input type="number" min="0" value={kapasitiDraft[d.nama]??getDormBil(d.nama)}
                                onChange={e=>setKapasitiDraft(prev=>({...prev,[d.nama]:e.target.value}))}
                                style={{width:"100%",padding:"4px 8px",border:"1px solid #eadcf5",borderRadius:6,fontSize:13,textAlign:"center"}}/>
                            </div>
                          ))}
                        </div>
                        <button onClick={()=>{
                          const parsed = Object.fromEntries(Object.entries(kapasitiDraft).map(([k,v])=>[k,parseInt(v)||0]));
                          localStorage.setItem("dorm_kapasiti_perempuan", JSON.stringify(parsed));
                          setDormKapasiti(parsed);
                          setShowKapasitiEdit(false);
                          showToast("✅ Kapasiti dorm disimpan!");
                        }} style={{...S.btn("#16a34a","#fff"),width:"100%",padding:10,fontSize:13}}>
                          💾 Simpan Kapasiti
                        </button>
                      </div>
                    )}
                  </div>

                  <div style={{paddingTop:12,marginBottom:12,borderTop:"1px solid #f1f5f9",paddingTop:12}}>
                    <button onClick={async()=>{
                      if(!window.confirm("Import semua jadual Mac 2026 ke Supabase?")) return;
                      const {error} = await db.upsertJadual(MAC_2026);
                      if(error){ showToast("⚠️ Gagal import","err"); return; }
                      showToast("✅ Jadual Mac 2026 berjaya diimport!"); loadJadual();
                    }} style={{...S.btn("#241032","#fff"),width:"100%",padding:12,fontSize:13}}>
                      📅 Import Jadual Mac 2026 ke Supabase
                    </button>
                  </div>
                  <div style={{paddingTop:12,marginBottom:12,borderTop:"1px solid #f1f5f9"}}>
                    <button onClick={async()=>{
                      if(!window.confirm("Import semua jadual April 2026 ke Supabase?")) return;
                      const {error} = await db.upsertJadual(APRIL_2026);
                      if(error){ showToast("⚠️ Gagal import","err"); return; }
                      showToast("✅ Jadual April 2026 berjaya diimport!"); loadJadual();
                    }} style={{...S.btn("#241032","#fff"),width:"100%",padding:12,fontSize:13}}>
                      📅 Import Jadual April 2026 ke Supabase
                    </button>
                  </div>
                  <div style={{paddingTop:12,marginBottom:12,borderTop:"1px solid #f1f5f9"}}>
                    <button onClick={async()=>{
                      if(!window.confirm("Import semua jadual Ogos 2026 ke Supabase?")) return;
                      const {error} = await db.upsertJadual(OGOS_2026);
                      if(error){ showToast("⚠️ Gagal import","err"); return; }
                      showToast("✅ Jadual Ogos 2026 berjaya diimport!"); loadJadual();
                    }} style={{...S.btn("#241032","#fff"),width:"100%",padding:12,fontSize:13}}>
                      📅 Import Jadual Ogos 2026 ke Supabase
                    </button>
                  </div>
                  <div style={{paddingTop:16,borderTop:"1px solid #f1f5f9"}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#374151",marginBottom:4}}>📸 Upload Gambar / PDF Jadual</div>
                    <div style={{fontSize:12,color:"#94a3b8",marginBottom:12}}>AI akan baca jadual dan masukkan automatik. Support gambar (JPG/PNG) dan PDF.</div>
                    <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:14,border:"2px dashed #eadcf5",borderRadius:10,cursor:"pointer",background:scanning?"#f8fafc":"#fff"}}>
                      <input type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={e=>e.target.files[0]&&scanJadual(e.target.files[0])}/>
                      {scanning?<><span>⏳</span><span style={{fontSize:13,color:"#7b6a83",fontWeight:600}}>AI sedang baca jadual...</span></>
                              :<><span>📄</span><span style={{fontSize:13,color:"#7b6a83"}}>Klik untuk upload gambar atau PDF jadual</span></>}
                    </label>
                    {scanError&&<div style={{marginTop:10,fontSize:12,color:"#dc2626",background:"#fee2e2",padding:"8px 12px",borderRadius:8}}>{scanError}</div>}
                    {scanResult&&(
                      <div style={{marginTop:12,background:"#f0fdf4",border:"1px solid #86efac",borderRadius:10,padding:14}}>
                        <div style={{fontSize:13,fontWeight:700,color:"#15803d",marginBottom:10}}>✅ AI jumpa {scanResult.length} entri:</div>
                        <div style={{maxHeight:160,overflowY:"auto",marginBottom:12}}>
                          {scanResult.map((r,i)=>(
                            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #dcfce7",fontSize:12}}>
                              <span>{fmtDate(r.tarikh)}</span>
                              <span style={{fontWeight:600,color:wColor(r.nama_warden)}}>{r.nama_warden}</span>
                            </div>
                          ))}
                        </div>
                        <div style={{display:"flex",gap:8}}>
                          <button onClick={confirmScan} style={{...S.btn("#16a34a","#fff"),flex:1,padding:10}}>✅ Simpan Semua</button>
                          <button onClick={()=>setScanResult(null)} style={{...S.btn("#f1f5f9","#8b5b9a"),padding:"10px 14px"}}>Batal</button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                <div style={{...S.card,marginBottom:14,padding:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                  <label style={{...S.label,margin:0,fontSize:13,whiteSpace:"nowrap"}}>Tapis Bulan:</label>
                  <input type="month" value={fBulan} onChange={e=>setFBulan(e.target.value)} style={{...S.input,flex:1}}/>
                  <button onClick={()=>setFBulan("")} style={S.btn("#f1f5f9","#8b5b9a")}>Reset</button>
                  <span style={{fontSize:12,color:"#94a3b8",whiteSpace:"nowrap"}}>{filteredJadual.length} entri</span>
                  <button onClick={exportJadualPDF} style={{...S.btn("#241032","#fff"),padding:"6px 14px",fontSize:12,whiteSpace:"nowrap"}}>📄 Export PDF</button>
                </div>

                {renderJadualGroups(true)}
              </div>
            )}
          </div>
        )}
      </div>
    {/* ADMIN PIN MODAL */}
      {showAdminPin&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
          <div style={{background:"#fff",borderRadius:18,padding:32,width:"100%",maxWidth:340,textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:10}}>🔐</div>
            <h3 style={{margin:"0 0 6px",fontSize:16}}>Admin Diperlukan</h3>
            <p style={{color:"#94a3b8",fontSize:13,marginBottom:20}}>Masukkan PIN admin untuk padam laporan</p>
            <input type="password" maxLength={4} placeholder="● ● ● ●"
              value={adminPinInput} onChange={e=>setAdminPinInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&checkAdminPin()}
              style={{width:"100%",padding:"12px",border:`2px solid ${adminPinError?"#dc2626":"#eadcf5"}`,borderRadius:10,fontSize:24,textAlign:"center",letterSpacing:8,marginBottom:10,boxSizing:"border-box",outline:"none"}}/>
            {adminPinError&&<div style={{color:"#dc2626",fontSize:12,marginBottom:10,fontWeight:600}}>PIN salah.</div>}
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setShowAdminPin(false);setPendingDeleteId(null);}} style={{flex:1,padding:11,border:"1px solid #eadcf5",borderRadius:9,background:"#f1f5f9",color:"#8b5b9a",cursor:"pointer",fontWeight:600,fontSize:13}}>Batal</button>
              <button onClick={checkAdminPin} style={{flex:1,padding:11,border:"none",borderRadius:9,background:"#241032",color:"#fff",cursor:"pointer",fontWeight:600,fontSize:13}}>Masuk</button>
            </div>
          </div>
        </div>
      )}
    </div>)}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
